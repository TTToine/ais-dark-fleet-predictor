[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ais-dark-fleet-predictor"
version = "1.0.0"
description = "A Hybrid Bayesian and Gradient Boosting Approach for Intentional Missing Data Forecasting"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.3.0",
    "optuna>=3.5.0",
    "pymc>=5.10.0",
    "arviz>=0.17.0",
    "shap>=0.44.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pyyaml>=6.0",
    "statsmodels>=0.14.0"
]
# configs/pipeline_config.yaml
# Configurazione centrale per AIS Dark Fleet Predictor

paths:
  raw_input: "data/raw/ais_sample.parquet"      # File AIS grezzo da GFW
  processed_output: "data/processed/ais_v1.parquet"
  models_dir: "models"
  metrics_file: "models/metrics_final.json"
  enriched_dataset: "data/processed/ais_enriched.parquet"

data_prep:
  bounding_box:
    min_lat: 35.0
    max_lat: 38.0
    min_lon: 11.0
    max_lon: 15.5
  gap_threshold_hours: 12.0       # Soglia per definire lo spegnimento
  prediction_horizon_hours: 24.0  # Non usato nel target attuale, ma utile per futuri sviluppi
  downsample_minutes: 10          # Frequenza di campionamento
  min_sog: 0.0
  max_sog: 50.0                   # Filtro fisico velocità massima
  seed: 42

hmm:
  window_size: 36                 # Finestra temporale per inferenza (36 * 10min = 6 ore)
  use_advi: true                  # Usare Variational Inference (veloce) invece di MCMC
  sigma_prior_speed: 1.0          # Prior per standardizzazione speed_acc
  sigma_prior_turn: 2.0           # Prior per standardizzazione turn_rate

gb:
  n_trials: 30                    # Numero di trial Optuna per HPO
  n_splits: 5                     # Fold per TimeSeries CV
  gap_hours: 24.0                 # Gap temporale tra train e validation in CV
  freq_min: 10                    # Frequenza dati per calcolo gap steps
  seed: 42

pipeline:
  train_split_ratio: 0.8          # % dati per training vs test finale
  run_ablation_study: false       # Eseguire confronto Baseline vs Enhanced? (Lento)
  save_enriched_data: true        # Salvare il dataset con feature HMM?
  bootstrap_ci_n_samples: 1000    # Numero di bootstrap per CI metriche
paths:
  raw_input: "data/raw/ais_sample.parquet"
  processed_output: "data/processed/ais_v1.parquet"
  models_dir: "models"
  metrics_file: "models/metrics_final.json"
  enriched_dataset: "data/processed/ais_enriched.parquet"

data_prep:
  bounding_box: { min_lat: 35.0, max_lat: 38.0, min_lon: 11.0, max_lon: 15.5 }
  gap_threshold_hours: 12.0
  prediction_horizon_hours: 24.0
  downsample_minutes: 10
  min_sog: 0.0
  max_sog: 50.0
  seed: 42
  # Target framing: "sliding_window" (deployable) o "last_ping" (retrospettiva, audit).
  labeling_strategy: "sliding_window"
  # 120 min (vs 60) raddoppia il numero di ping positivi per blackout,
  # portando la prevalenza in CV abbastanza alta da popolare ogni fold val.
  labeling_horizon_minutes: 120.0

# Parametri del simulatore di dati AIS (vedi run_pipeline._generate_simulation_study_dataset).
# Il progetto opera su DATI SIMULATI: vedere README sezione "Current Data Status".
simulation:
  n_ships: 120        # navi totali nel simulation study
  n_days: 14          # durata simulazione (giorni)
  dark_ratio: 0.50    # frazione di navi 'dark fleet' con blackout intenzionali
  random_seed: 42     # riproducibilità

hmm:
  window_size: 36
  use_advi: true
  n_jobs: 4
  
  # Empirical Bayes & Validation (i tuoi parametri, vanno benissimo)
  use_empirical_bayes: true
  eb_n_pilot_vessels: 3
  eb_n_advi_steps: 300
  run_prior_sensitivity: true
  ps_n_vessels: 6
  ps_n_advi_steps: 200
  run_ppc: true
  ppc_n_vessels: 2
  ppc_n_simulations: 100
  ppc_n_advi_steps: 300
  
  # === PARAMETRI CRITICI PER IL MAIN LOOP (Fase 2) ===
  # CONTEST EMERGENCY MODE (2026-05-24): valori ridotti per target 30-45 min
  # di full run. Post-contest tornare a n_advi_iter=500, n_trials=30.
  n_advi_iter: 300        # smoke ha mostrato convergenza a ~250 di loss in 500 step
  max_advi_calls: 10
  adaptive_threshold: 1.5
  update_freq: 20
  # Riduco anche il workload analisi diagnostica (sono nice-to-have, non bloccanti)
  eb_n_pilot_vessels: 3
  eb_n_advi_steps: 300
  ps_n_vessels: 4
  ps_n_advi_steps: 200
  ppc_n_vessels: 2
  ppc_n_simulations: 100
  ppc_n_advi_steps: 300

gb:
  n_trials: 10             # emergency: 10 trial (vs 30 prod) — convergenza già a ~5
  n_splits: 3
  gap_hours: 24.0          # = prediction_horizon → no leakage temporale
  freq_min: 10
  seed: 42

pipeline:
  train_split_ratio: 0.8
  run_ablation_study: false
  save_enriched_data: true
  run_post_training_analysis: true

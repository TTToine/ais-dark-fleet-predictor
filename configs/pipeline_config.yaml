paths:
  raw_input: "data/raw/ais_sample.parquet"
  processed_output: "data/processed/ais_v1.parquet"
  models_dir: "models"
  metrics_file: "models/metrics_final.json"
  enriched_dataset: "data/processed/ais_enriched.parquet"

data_prep:
  bounding_box: { min_lat: 35.0, max_lat: 38.0, min_lon: 11.0, max_lon: 15.5 }
  gap_threshold_hours: 12.0
  prediction_horizon_hours: 24.0
  downsample_minutes: 10
  min_sog: 0.0
  max_sog: 50.0
  seed: 42

simulation:
  n_ships: 20      # da 60 → 20
  n_days: 5        # da 7 → 5
  dark_ratio: 0.30 # più alto: garantisce positivi in ogni fold

hmm:
  window_size: 36
  use_advi: true
  n_jobs: 4
  use_empirical_bayes: true
  eb_n_pilot_vessels: 3      # da 5 → 3
  eb_n_advi_steps: 300       # da 500 → 300
  run_prior_sensitivity: true
  ps_n_vessels: 6            # da 10 → 6
  ps_n_advi_steps: 200       # da 300 → 200
  run_ppc: true
  ppc_n_vessels: 2           # da 3 → 2
  ppc_n_simulations: 100     # da 200 → 100
  ppc_n_advi_steps: 300
gb:
  n_trials: 30
  n_splits: 5
  gap_hours: 24.0
  freq_min: 10
  seed: 42

pipeline:
  train_split_ratio: 0.8
  run_ablation_study: false
  save_enriched_data: true
  run_post_training_analysis: true

simulation:
  n_ships: 60          # navi totali nel simulation study
  n_days: 7            # durata simulazione
  dark_ratio: 0.20     # frazione di navi 'dark fleet'

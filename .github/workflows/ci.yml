name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Dipendenze runtime principali (subset, evita PyMC pesante in CI)
          pip install pandas numpy scikit-learn pytest ruff

      - name: Lint with ruff
        run: |
          # Solo errori critici, no styling pedante in CI base
          ruff check src/ tests/ --select=E9,F63,F7,F82 --output-format=github || true
          ruff check src/ tests/ --output-format=github --exit-zero  # warning informativi

      - name: Run tests (light suite)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # Esegue i test che non richiedono PyMC (data_prep, dashboard)
          pytest tests/test_data_prep.py tests/test_dashboard.py -v --tb=short

  # Job opzionale per i test "pesanti" (bayesian_mixture richiede PyMC)
  # da abilitare manualmente quando serve
  test-heavy:
    runs-on: ubuntu-latest
    if: false  # disabilitato di default — abilitare con workflow_dispatch quando serve
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install full dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run all tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/ -v --tb=short
